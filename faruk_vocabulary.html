<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faruk Phrasal Kartcıklar</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden; /* Taşmayı engeller */
            background-color: #0b0f17;
            color: #f3f4f6;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 16px;
        }

        /* Top Header Navigation */
        .navbar {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 5px 0;
        }

        @media (min-width: 640px) {
            .navbar {
                flex-direction: row;
                justify-content: space-between;
                margin-bottom: 25px;
            }
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .logo-icon {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .logo-text {
            flex: 1;
            overflow: hidden;
        }

        .logo-text h1 {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.3px;
            white-space: nowrap;
        }

        .badge-tag {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            font-weight: 600;
        }

        .logo-text p {
            font-size: 11px;
            color: #6b7280;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats-bar {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: space-between;
        }

        /* Tıklanabilir İstatistik / Filtre Butonları */
        .stat-badge {
            background: #131924;
            border: 1px solid #1f2937;
            padding: 6px 10px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            flex: 1;
        }

        .stat-badge:active {
            transform: scale(0.95);
        }

        .stat-badge.deste { color: #a78bfa; }
        .stat-badge.biliyorum { color: #34d399; }
        .stat-badge.bilmiyorum { color: #f87171; }

        .stat-badge.active-filter {
            box-shadow: 0 0 10px currentColor;
            border-color: currentColor;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Mode Banner */
        .mode-banner {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            width: 100%;
            padding: 8px;
            border-radius: 12px;
            font-size: 11px;
            text-align: center;
            margin-bottom: 12px;
            font-weight: 600;
            display: none;
        }

        /* Progress Bar Section */
        .progress-section {
            width: 100%;
            margin-bottom: 12px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .progress-bar-bg {
            width: 100%;
            height: 5px;
            background: #1f2937;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #10b981);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Swipe Hints */
        .swipe-hints {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .hint-btn {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 5px 10px;
            border-radius: 16px;
        }

        .hint-btn.red {
            background: rgba(244, 63, 94, 0.1);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        /* Card Wrapper & Responsive Dynamic Height */
        .card-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            max-height: 55vh;
            perspective: 1000px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            background: #131924;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            cursor: grab;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            user-select: none;
            touch-action: none;
            transition: transform 0.14s ease, border-color 0.12s ease, opacity 0.14s ease;
        }

        .flashcard:active {
            cursor: grabbing;
        }

        .flashcard.swiping-left {
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .flashcard.swiping-right {
            border-color: #f43f5e;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.3);
        }

        .card-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-number {
            background: #1f2937;
            color: #9ca3af;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .listen-btn {
            background: #1f2937;
            color: #e5e7eb;
            border: 1px solid #374151;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .listen-btn:hover {
            background: #374151;
            color: #ffffff;
        }

        .card-body {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            padding: 10px 0;
            transition: opacity 0.08s ease;
        }

        .word-title-badge {
            color: #818cf8;
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .word-main {
            font-size: clamp(22px, 6vw, 30px);
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            word-break: break-word;
        }

        .word-meaning {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 700;
            color: #c084fc;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
            word-break: break-word;
        }

        .example-box {
            background: rgba(31, 41, 55, 0.4);
            border: 1px solid rgba(55, 65, 81, 0.5);
            padding: 10px 12px;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 10px;
        }

        .example-sentence {
            font-size: 12px;
            color: #e5e7eb;
            line-height: 1.35;
            font-weight: 500;
        }

        .example-translation {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
            font-style: italic;
        }

        .type-detail {
            font-size: 10px;
            color: #818cf8;
            font-weight: 700;
            background: rgba(99, 102, 241, 0.12);
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toggle-btn {
            background: #1f2937;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .action-controls {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-action {
            flex: 1;
            padding: 12px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .btn-know {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .btn-dont-know {
            background: rgba(244, 63, 94, 0.12);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.25);
        }

        .btn-reset {
            background: #1f2937;
            color: #9ca3af;
            border: 1px solid #374151;
            width: 46px;
            flex: 0 0 46px;
            border-radius: 12px;
        }

        .btn-previous {
            background: #1f2937;
            color: #a5b4fc;
            border: 1px solid #374151;
            width: 46px;
            flex: 0 0 46px;
            border-radius: 12px;
        }

        .btn-previous:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <div class="navbar">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="logo-text">
                <h1>Faruk Phrasal Kartcıklar <span class="badge-tag">YÖKDİL / YDS</span></h1>
                <p>Sınav Yeterlilik Kelime Kartları • En çok çıkanlar <3</p>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-badge deste active-filter" id="btn-filter-all" onclick="setFilter('all')">
                <i class="fa-solid fa-layer-group"></i> Deste <span id="stat-total">0</span>
            </div>
            <div class="stat-badge biliyorum" id="btn-filter-known" onclick="setFilter('known')">
                <i class="fa-regular fa-circle-check"></i> Biliyorum <span id="stat-known">0</span>
            </div>
            <div class="stat-badge bilmiyorum" id="btn-filter-unknown" onclick="setFilter('unknown')">
                <i class="fa-regular fa-circle-xmark"></i> Bilmiyorum <span id="stat-unknown">0</span>
            </div>
        </div>
    </div>

    <!-- Main Card Content -->
    <div class="container">

        <div class="mode-banner" id="mode-banner">
            Şu an sadece seçilen kartlar gösteriliyor.
        </div>

        <div class="progress-section">
            <div class="progress-header">
                <span>Tamamlanan İlerleme</span>
                <span id="progress-text">0 / 0 (%0)</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="swipe-hints">
            <span class="hint-btn"><i class="fa-solid fa-arrow-left"></i> Sola: Biliyorum</span>
            <span style="color:#4b5563"><i class="fa-solid fa-hand-pointer"></i></span>
            <span class="hint-btn red">Sağa: Bilmiyorum <i class="fa-solid fa-arrow-right"></i></span>
        </div>

        <!-- Flashcard Wrapper -->
        <div class="card-wrapper">
            <div class="flashcard" id="card-element">
                <div class="card-top">
                    <span class="card-number" id="card-index">#1 / 10</span>
                    <button class="listen-btn" onclick="event.stopPropagation(); speakWord();">
                        <i class="fa-solid fa-volume-high"></i> Dinle
                    </button>
                </div>

                <div class="card-body" id="card-content">
                    <!-- İçerik Dinamik Yüklenir -->
                </div>

                <div class="toggle-btn" id="toggle-btn">
                    <i class="fa-solid fa-rotate"></i> Anlamını Görmek İçin Tıkla
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-controls">
            <button class="btn-action btn-previous" id="btn-previous" onclick="previousCard()" title="Önceki kartı geri getir ve yeniden işaretle" aria-label="Önceki kartı geri getir ve yeniden işaretle" disabled>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button class="btn-action btn-know" onclick="markCard(true)">
                <i class="fa-solid fa-check"></i> Biliyorum
            </button>
            <button class="btn-action btn-reset" onclick="resetDeck()" title="İlerlemeyi Sıfırla">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <button class="btn-action btn-dont-know" onclick="markCard(false)">
                Bilmiyorum <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

    </div>

    <script>
        // KELİME LİSTESİ
        const rawVocabularyList = [

            { id: 2664, word: "to witness", type: "fiil", meaning: "tanık olmak, görmek", example: "They witnessed the launch of the new satellite.", exampleTr: "Yeni uydunun fırlatılışına tanık oldular." },
            { id: 2665, word: "wolf", type: "isim", meaning: "kurt", example: "A wolf was spotted near the forest.", exampleTr: "Ormanın yakınında bir kurt görüldü." },
            { id: 2666, word: "workforce", type: "isim", meaning: "iş gücü; çalışanlar", example: "The company is training its workforce in new skills.", exampleTr: "Şirket çalışanlarını yeni beceriler konusunda eğitiyor." },
            { id: 2667, word: "workplace", type: "isim", meaning: "iş yeri, çalışma ortamı", example: "Respect is important in every workplace.", exampleTr: "Saygı her iş yerinde önemlidir." },
            { id: 2668, word: "workshop", type: "isim", meaning: "atölye; çalıştay", example: "They attended a workshop on creative writing.", exampleTr: "Yaratıcı yazarlık üzerine bir çalıştaya katıldılar." },
            { id: 2669, word: "worm", type: "isim", meaning: "solucan; kurtçuk", example: "The bird found a worm in the soil.", exampleTr: "Kuş toprakta bir solucan buldu." },
            { id: 2670, word: "wound", type: "isim", meaning: "yara", example: "The nurse cleaned and covered the wound.", exampleTr: "Hemşire yarayı temizleyip sardı." },
            { id: 2671, word: "to wound", type: "fiil", meaning: "yaralamak; incitmek", example: "The falling branch wounded his arm.", exampleTr: "Düşen dal kolunu yaraladı." },
            { id: 2672, word: "to wrap", type: "fiil", meaning: "sarmak, paketlemek; dolamak", example: "She wrapped the gift in blue paper.", exampleTr: "Hediyeyi mavi kâğıda sardı." },
            { id: 2673, word: "wrist", type: "isim", meaning: "bilek; el bileği", example: "He wore a watch on his left wrist.", exampleTr: "Sol bileğinde bir saat takıyordu." },
            { id: 2674, word: "zone", type: "isim", meaning: "bölge, alan; kuşak", example: "This is a quiet zone, so please keep your voice low.", exampleTr: "Burası sessiz bir bölgedir, bu yüzden lütfen alçak sesle konuşun." }
        ];

        // LOCALSTORAGE HAFIZA YÖNETİMİ
        let userState = JSON.parse(localStorage.getItem('faruk_flashcard_state')) || {
            knownIds: [],
            unknownIds: [],
            currentIndex: 0
        };

        let currentFilter = 'all'; 
        let activeDeck = [];
        let internalIndex = 0;
        let isShowingMeaning = false;
        let isAnimatingCard = false;
        let renderTimeoutId;

        const cardElement = document.getElementById("card-element");
        const cardContent = document.getElementById("card-content");
        const cardIndex = document.getElementById("card-index");
        const toggleBtn = document.getElementById("toggle-btn");
        const previousButton = document.getElementById("btn-previous");
        const modeBanner = document.getElementById("mode-banner");

        const statTotal = document.getElementById("stat-total");
        const statKnown = document.getElementById("stat-known");
        const statUnknown = document.getElementById("stat-unknown");

        const progressText = document.getElementById("progress-text");
        const progressFill = document.getElementById("progress-fill");

        function saveState() {
            localStorage.setItem('faruk_flashcard_state', JSON.stringify(userState));
        }

        function initApp() {
            statTotal.innerText = rawVocabularyList.length;
            applyFilter();
            setupSwipeEvents();
        }

        function applyFilter() {
            document.querySelectorAll('.stat-badge').forEach(b => b.classList.remove('active-filter'));

            if (currentFilter === 'known') {
                activeDeck = rawVocabularyList.filter(item => userState.knownIds.includes(item.id));
                document.getElementById('btn-filter-known').classList.add('active-filter');
                modeBanner.innerText = "🔍 Sadece 'Bildiğim' kelimeler inceleniyor";
                modeBanner.style.display = "block";
            } else if (currentFilter === 'unknown') {
                activeDeck = rawVocabularyList.filter(item => userState.unknownIds.includes(item.id));
                document.getElementById('btn-filter-unknown').classList.add('active-filter');
                modeBanner.innerText = "🔍 Sadece 'Bilmediğim' kelimeler inceleniyor";
                modeBanner.style.display = "block";
            } else {
                activeDeck = [...rawVocabularyList];
                document.getElementById('btn-filter-all').classList.add('active-filter');
                modeBanner.style.display = "none";
            }

            internalIndex = currentFilter === 'all' ? Math.min(userState.currentIndex, activeDeck.length) : 0;
            isShowingMeaning = false;
            renderCard();
            updateStats();
        }

        function setFilter(filterType) {
            if (isAnimatingCard) return;
            currentFilter = filterType;
            applyFilter();
        }

        function renderCard() {
            clearTimeout(renderTimeoutId);
            if (activeDeck.length === 0) {
                cardContent.innerHTML = `
                    <div class="word-main" style="color:#9ca3af; font-size:18px;">Bu listede kelime yok.</div>
                    <div class="example-sentence" style="margin-top:8px;">Diğer kategorilere göz atabilirsiniz.</div>
                `;
                cardIndex.innerText = `#0 / 0`;
                toggleBtn.style.display = 'none';
                previousButton.disabled = true;
                return;
            }

            if (internalIndex >= activeDeck.length) {
                cardContent.innerHTML = `
                    <div class="word-main" style="color:#34d399; font-size:22px;">Tebrikler! 🎉</div>
                    <div class="example-sentence" style="margin-top:8px;">Bu destedeki tüm kelimeleri tamamladınız.</div>
                `;
                cardIndex.innerText = `#${activeDeck.length} / ${activeDeck.length}`;
                toggleBtn.style.display = 'none';
                previousButton.disabled = internalIndex === 0;
                return;
            }

            toggleBtn.style.display = 'flex';
            previousButton.disabled = internalIndex === 0;
            const item = activeDeck[internalIndex];
            cardIndex.innerText = `#${internalIndex + 1} / ${activeDeck.length}`;

            cardContent.style.opacity = '0';
            
            renderTimeoutId = setTimeout(() => {
                if (!isShowingMeaning) {
                    cardContent.innerHTML = `
                        <div class="word-title-badge">KELİME</div>
                        <div class="word-main">${item.word}</div>
                    `;
                    toggleBtn.innerHTML = `<i class="fa-solid fa-rotate"></i> Anlamını Görmek İçin Tıkla`;
                } else {
                    cardContent.innerHTML = `
                        <div class="word-meaning">${item.meaning}</div>
                        <div class="example-box">
                            <div class="example-sentence">"${item.example}"</div>
                            <div class="example-translation">${item.exampleTr}</div>
                        </div>
                        <div class="type-detail">Tür: ${item.type}</div>
                    `;
                    toggleBtn.innerHTML = `<i class="fa-solid fa-rotate"></i> Kelimeye Dön`;
                }
                cardContent.style.opacity = '1';
            }, 40);
        }

        function toggleCard() {
            if (internalIndex < activeDeck.length) {
                isShowingMeaning = !isShowingMeaning;
                renderCard();
            }
        }

        function speakWord() {
            if (internalIndex < activeDeck.length) {
                const utterance = new SpeechSynthesisUtterance(activeDeck[internalIndex].word);
                utterance.lang = "en-US";
                window.speechSynthesis.speak(utterance);
            }
        }

        function markCard(isKnown) {
            if (isAnimatingCard || internalIndex >= activeDeck.length) return;

            const currentItem = activeDeck[internalIndex];

            if (isKnown) {
                if (!userState.knownIds.includes(currentItem.id)) userState.knownIds.push(currentItem.id);
                userState.unknownIds = userState.unknownIds.filter(id => id !== currentItem.id);
            } else {
                if (!userState.unknownIds.includes(currentItem.id)) userState.unknownIds.push(currentItem.id);
                userState.knownIds = userState.knownIds.filter(id => id !== currentItem.id);
            }

            const direction = isKnown ? -1 : 1;
            isAnimatingCard = true;
            previousButton.disabled = true;
            cardElement.style.transition = "transform 0.18s ease, opacity 0.18s ease";
            cardElement.style.transform = `translateX(${direction * 360}px) rotate(${direction * 22}deg)`;
            cardElement.style.opacity = "0";

            setTimeout(() => {
                if (currentFilter === 'all') {
                    userState.currentIndex++;
                    internalIndex = userState.currentIndex;
                } else {
                    internalIndex++;
                }

                isAnimatingCard = false;
                saveState();

                cardElement.style.transition = "none";
                cardElement.style.transform = "translateX(0) rotate(0deg)";
                cardElement.style.opacity = "1";
                isShowingMeaning = false;
                renderCard();
                updateStats();
            }, 180);
        }

        function previousCard() {
            if (isAnimatingCard || internalIndex <= 0) return;

            internalIndex--;
            const previousItem = activeDeck[internalIndex];
            userState.knownIds = userState.knownIds.filter(id => id !== previousItem.id);
            userState.unknownIds = userState.unknownIds.filter(id => id !== previousItem.id);

            if (currentFilter === 'all') {
                userState.currentIndex = internalIndex;
            }

            cardElement.style.transition = "none";
            cardElement.style.transform = "translateX(0) rotate(0deg)";
            cardElement.style.opacity = "1";
            isShowingMeaning = false;
            saveState();
            renderCard();
            updateStats();
        }

        function updateStats() {
            statKnown.innerText = userState.knownIds.length;
            statUnknown.innerText = userState.unknownIds.length;

            const completed = userState.knownIds.length + userState.unknownIds.length;
            const percent = rawVocabularyList.length > 0 ? Math.round((completed / rawVocabularyList.length) * 100) : 0;

            progressText.innerText = `${completed} / ${rawVocabularyList.length} (%${percent})`;
            progressFill.style.width = `${percent}%`;
        }

        function resetDeck() {
            if (isAnimatingCard) return;
            if (confirm("Tüm ilerlemeniz sıfırlanacak. Emin misiniz?")) {
                userState = { knownIds: [], unknownIds: [], currentIndex: 0 };
                saveState();
                currentFilter = 'all';
                applyFilter();
            }
        }

        /* -------------------------------------------------------------
           SWIPE / SÜRÜKLE - BIRAK MANTIĞI
        ------------------------------------------------------------- */
        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        function setupSwipeEvents() {
            cardElement.addEventListener("click", (e) => {
                if (Math.abs(currentX - startX) < 8) {
                    toggleCard();
                }
            });

            cardElement.addEventListener("mousedown", startDrag);
            cardElement.addEventListener("touchstart", startDrag, { passive: true });

            window.addEventListener("mousemove", drag);
            window.addEventListener("touchmove", drag, { passive: true });

            window.addEventListener("mouseup", endDrag);
            window.addEventListener("touchend", endDrag);
        }

        function startDrag(e) {
            if (isAnimatingCard || internalIndex >= activeDeck.length) return;
            isDragging = true;
            startX = e.type.includes("touch") ? e.touches[0].clientX : e.clientX;
            currentX = startX;
            cardElement.style.transition = "none";
        }

        function drag(e) {
            if (!isDragging) return;
            currentX = e.type.includes("touch") ? e.touches[0].clientX : e.clientX;
            const diffX = currentX - startX;
            const rotate = diffX * 0.07;

            cardElement.style.transform = `translateX(${diffX}px) rotate(${rotate}deg)`;

            if (diffX < -40) {
                cardElement.classList.add("swiping-left");
                cardElement.classList.remove("swiping-right");
            } else if (diffX > 40) {
                cardElement.classList.add("swiping-right");
                cardElement.classList.remove("swiping-left");
            } else {
                cardElement.classList.remove("swiping-left", "swiping-right");
            }
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            const diffX = currentX - startX;
            cardElement.classList.remove("swiping-left", "swiping-right");

            if (diffX < -90) {
                markCard(true);
            } else if (diffX > 90) {
                markCard(false);
            } else {
                cardElement.style.transition = "transform 0.14s ease";
                cardElement.style.transform = "translateX(0) rotate(0deg)";
            }
            
            startX = 0;
            currentX = 0;
        }

        initApp();
    </script>
</body>
</html>
